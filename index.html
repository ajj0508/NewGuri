<style>
body{-webkit-font-smoothing:antialiased;word-break:keep-all}
.dot{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 4px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:-.3px;border:1.5px solid #e5e5e5;color:#a3a3a3;background:#fff}
.dot.yes{background:#16a34a;border-color:#16a34a;color:#fff}
.dot.no{background:#f5f5f5;border-color:#f5f5f5;color:#bdbdbd;text-decoration:line-through}
.dot.next{border:2px solid #e35205;color:#e35205;background:#fff4ed}
.msg b.o{color:#e35205} .msg b.g{color:#16a34a} .msg b.r{color:#737373} .msg b{font-weight:700}
.tab.on{color:#bc3d06;border-color:#e35205} .tab{border-bottom:2px solid transparent}

<body class="bg-neutral-100 text-neutral-900 font-sans">
<div class="mx-auto w-full max-w-[440px] min-h-screen bg-neutral-50 px-4 pt-6 pb-12">
<div id="hdr" class="flex items-center justify-between">
  <div class="flex flex-col gap-1">
    <span class="text-xs font-bold text-brand-600">신구리TFP지점</span>
    <span id="title" class="text-[21px] font-extrabold tracking-tight">11월 내 시상함</span>
    <span class="text-xs text-neutral-500" id="sub"></span>
  </div>
  <button id="sbtn" class="hidden h-10 w-10 flex-none items-center justify-center rounded-full bg-white shadow-sm" aria-label="이름 검색">
    <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
</div>

<div id="lock" class="mt-6 rounded-2xl bg-white p-5 shadow-sm">
  <div class="mb-1 flex h-11 w-11 items-center justify-center rounded-full bg-brand-50 text-brand-600"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <p class="mt-3 text-lg font-extrabold">지점 비밀번호를 입력하세요</p>
  <p class="mt-1 text-sm text-neutral-500">톡방에 공유된 비밀번호예요</p>
  <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" class="mt-4 w-full rounded-xl border border-neutral-200 bg-neutral-50 px-4 py-3.5 text-center text-2xl font-bold tracking-[.5em] outline-none focus:border-brand-600 focus:bg-white">
  <button id="pwb" class="mt-3 w-full rounded-xl bg-brand-600 py-3.5 text-base font-bold text-white active:bg-brand-700">확인</button>
  <p id="pwh" class="mt-2 h-5 text-center text-sm text-neutral-500"></p>
</div>

<div id="search" class="mt-6 hidden">
  <div class="rounded-2xl bg-white p-5 shadow-sm">
    <p class="text-lg font-extrabold">내 이름을 입력하세요</p>
    <div class="mt-3 flex items-center gap-2 rounded-xl border border-neutral-200 bg-neutral-50 px-4 focus-within:border-brand-600 focus-within:bg-white">
      <svg class="ic text-neutral-400" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="예) 홍길동" class="w-full bg-transparent py-3.5 text-lg font-bold outline-none">
    </div>
    <div id="sug" class="mt-3 flex flex-wrap gap-2"></div>
    <p id="hint" class="mt-2 text-sm text-neutral-500">성과 이름을 모두 입력하면 바로 열려요</p>
  </div>
</div>

<div id="promo" class="mt-5 flex flex-col gap-3">
  <p class="px-1 text-sm font-extrabold text-neutral-700">이번 주 시상 안내</p>
  <img src="img/w3_towel.jpg?v=1116" alt="11월 3주차 시상 휴그마인 타월 세트" class="w-full rounded-2xl shadow-sm" loading="lazy">
  <img src="img/w3_mandu.jpg?v=1116" alt="3주차 월·화 가동 시 한화 특별 만두세트" class="w-full rounded-2xl shadow-sm" loading="lazy">
</div>
<div id="me" class="mt-4 hidden flex-col gap-4"></div>
<p class="mt-8 text-center text-xs text-neutral-400" id="foot"></p>
